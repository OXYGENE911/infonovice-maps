# CI de chaque PR : lint + typecheck + tests unitaires + E2E + build + audit.
# Une PR ne se merge que si ce workflow est vert — c'est la règle du projet,
# et la protection de branche l'impose.
name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  verifier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        # NODE 24 (04/09/2026) : le npm 10 embarqué par Node 22 appelle
        # l'ancien point d'audit de npmjs, en cours de retrait — la CI
        # tombait en 400 « endpoint is being retired » sur un code sain.
        # npm 11 (Node 24) parle au point « bulk ». Mesuré : même commit,
        # audit rouge en 10, vert en 11.
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - name: Lint et typecheck
        run: npm run lint
      - name: Tests unitaires
        run: npm test
      - name: Build
        run: npm run build
      - name: Navigateurs Playwright
        run: npx playwright install --with-deps chromium
      - name: Tests bout-en-bout
        run: npm run e2e
      - name: Traces des parcours en échec
        # Publiées SEULEMENT quand un parcours rougit : `npx playwright
        # show-trace trace.zip` montre ce que le runner voyait.
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: traces-playwright
          path: test-results/**/trace.zip
          if-no-files-found: ignore
          retention-days: 7
      - name: Audit des dépendances
        # Bloquant à partir de « high » : un audit qui ne bloque jamais
        # n'est qu'un bruit de journal.
        # MAIS UNE PANNE DU REGISTRE N'EST PAS UNE VULNÉRABILITÉ (AUDIT-3,
        # 04/09) : trois essais (AUDIT-2) sont tombés d'affilée sur une
        # panne npm prolongée — cinq minutes de pendaison chacun, et une
        # file de fusions paralysée alors que TOUS les tests passaient. La
        # panne se reconnaît à son message ; elle s'avertit, elle ne bloque
        # pas. Une vraie vulnérabilité, elle, bloque toujours.
        run: |
          for essai in 1 2 3; do
            if SORTIE=$(npm audit --audit-level=high --fetch-timeout=60000 2>&1); then
              echo "$SORTIE"
              exit 0
            fi
            echo "$SORTIE"
            if ! grep -q "audit endpoint returned an error" <<< "$SORTIE"; then
              exit 1
            fi
            echo "registre indisponible (essai $essai)"
            [ "$essai" -lt 3 ] && sleep 30
          done
          echo "::warning title=Audit non exécuté::registre npm en panne — l'audit repassera au prochain run"
          exit 0
      - name: Budget du bundle (< 300 Ko gzippé hors MapLibre)
        run: |
          TOTAL=0
          for f in $(find dist/assets -name '*.js' ! -name '*maplibre*' 2>/dev/null); do
            TAILLE=$(gzip -c "$f" | wc -c)
            TOTAL=$((TOTAL + TAILLE))
          done
          echo "Bundle applicatif gzippé : ${TOTAL} octets"
          if [ "$TOTAL" -gt 307200 ]; then
            echo "::error::Budget dépassé : ${TOTAL} > 307200 octets" && exit 1
          fi
