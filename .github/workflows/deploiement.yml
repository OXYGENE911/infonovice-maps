# Déploiement GitHub Pages : chaque fusion sur main publie le build.
# Pages est configuré en source « GitHub Actions » (pas de branche gh-pages).
name: Déploiement
on:
  push:
    branches: [main]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  construire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 24, cache: npm }
      - run: npm ci
      # maps.infonovice.fr est en service (21/08/2026) : le site vit à la
      # racine du domaine, la base par défaut du dépôt. L'époque du sous-chemin
      # github.io est consignée dans docs/DEPLOIEMENT.md.
      - run: npm run build
      # `include-hidden-files: true` N'EST PAS UN DETAIL (18/09/2026).
      # Par defaut, cette action empaquette `dist/` avec
      # `tar --exclude=.[^/]*`, qui ECARTE TOUT CHEMIN COMMENCANT PAR UN POINT
      # a la racine du site. Elle a donc jete `/.well-known/` en entier, sans
      # un mot dans le journal : l'action est verte, le deploiement reussit, et
      # `/.well-known/assetlinks.json` repond 404. Or ce fichier est ce qui
      # autorise l'application Android a masquer la barre d'adresse de Chrome ;
      # sans lui la TWA ressemble a un onglet. Le piege a coute une demi-heure
      # et une fausse piste (Jekyll, qui n'y est pour rien : la source Pages
      # est « GitHub Actions », aucun Jekyll ne tourne). La preuve est dans le
      # journal de l'execution 35370442922, ou le listing du tar ne contient ni
      # `.well-known/` ni `.nojekyll`.
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
          include-hidden-files: true
  publier:
    needs: construire
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - id: deploiement
        uses: actions/deploy-pages@v5
