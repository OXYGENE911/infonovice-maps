# Déploiement GitHub Pages : chaque fusion sur main publie le build.
# Pages est configuré en source « GitHub Actions » (pas de branche gh-pages).
name: Déploiement
on:
  push:
    branches: [main]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  construire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      # PROVISOIRE : tant que maps.infonovice.fr n'est pas câblé (CNAME
      # Cloudflare + domaine personnalisé Pages, voir docs/DEPLOIEMENT.md), le
      # site vit sous /infonovice-maps/ sur github.io — le build doit le savoir.
      # À la mise en service du domaine : supprimer cette variable (retour à la
      # racine, valeur par défaut du dépôt).
      - run: npm run build
        env:
          BASE_PUBLIQUE: /infonovice-maps/
      - uses: actions/upload-pages-artifact@v3
        with: { path: dist }
  publier:
    needs: construire
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - id: deploiement
        uses: actions/deploy-pages@v4
