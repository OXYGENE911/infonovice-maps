# Déploiement GitHub Pages : chaque fusion sur main publie le build.
# Pages est configuré en source « GitHub Actions » (pas de branche gh-pages).
name: Déploiement
on:
  push:
    branches: [main]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  construire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm }
      - run: npm ci
      # maps.infonovice.fr est en service (21/08/2026) : le site vit à la
      # racine du domaine, la base par défaut du dépôt. L'époque du sous-chemin
      # github.io est consignée dans docs/DEPLOIEMENT.md.
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with: { path: dist }
  publier:
    needs: construire
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - id: deploiement
        uses: actions/deploy-pages@v4
