<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <!-- CSP stricte : seules origines réseau, les API souveraines du projet.
       Élargir cette liste est une DÉCISION, tracée par PR — jamais un réflexe. -->
    <!-- PAS DE `frame-ancestors` ICI, ET C'EST DÉLIBÉRÉ. Le navigateur
         l'IGNORE lorsqu'il est livré par une balise <meta> — il le dit
         lui-même dans la console : « The Content Security Policy directive
         'frame-ancestors' is ignored when delivered via a <meta> element ».
         Il ne protégeait donc de rien, tout en polluant la console, ce qui
         masque les vraies erreurs et coûtait un point de « bonnes pratiques »
         à l'audit. La protection contre l'encadrement demande un EN-TÊTE HTTP,
         que GitHub Pages ne permet pas d'ajouter. Limite assumée, écrite ici
         plutôt que déguisée en directive inopérante. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self';
    img-src 'self' data: blob: https://data.geopf.fr https://panoramax.openstreetmap.fr https://upload.wikimedia.org;
    connect-src 'self' https://data.geopf.fr https://geo.api.gouv.fr https://api-adresse.data.gouv.fr https://data.economie.gouv.fr https://public.opendatasoft.com https://api.panoramax.xyz https://api.open-meteo.com https://www.bison-fute.gouv.fr https://www1.bison-fute.gouv.fr https://proxy.transport.data.gouv.fr https://overpass.openstreetmap.fr https://query.wikidata.org https://commons.wikimedia.org https://data.education.gouv.fr https://api-lannuaire.service-public.fr https://recherche-entreprises.api.gouv.fr https://tabular-api.data.gouv.fr https://data.ampmetropole.fr https://data.nantesmetropole.fr;
    style-src 'self' 'unsafe-inline'; script-src 'self'; worker-src 'self' blob:;
    base-uri 'self'; form-action 'self'">
  <meta name="description" content="Infonovice Maps — cartographie et itinéraires
    souverains. L’alternative française à Google Maps : fond IGN, adresses BAN,
    zéro tracking.">
  <!-- LA COULEUR DE LA BARRE DU NAVIGATEUR suit le FOND de l'application,
       pas la charte sombre : « une grosse barre noire horizontale tout en
       haut de l'écran, aucun intérêt » (Armelin, 29/08, en mobile). -->
  <meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0E1014" media="(prefers-color-scheme: dark)">
  <title>Infonovice Maps — cartographie souveraine française</title>
  <link rel="canonical" href="https://maps.infonovice.fr/">
  <!-- LA MASCOTTE (LOGO-1, 03/09) : le chien à la carte, dessiné par Armelin
       via GPT, décliné depuis la 1024 transparente et quantifié en 256
       couleurs — l'illustration est en aplats, le grain de génération ne
       mérite pas ses kilo-octets. -->
  <link rel="icon" href="/icones/favicon-48.png" sizes="48x48" type="image/png">
  <link rel="icon" href="/icones/icone-192.png" sizes="192x192" type="image/png">
  <link rel="apple-touch-icon" href="/icones/apple-touch-icon.png">
  <!-- Partage social : l'image est GÉNÉRÉE par script (scripts/generer-partage.mjs),
       comme les icônes — pas de binaire opaque au dépôt. Pas de balise Twitter
       propriétaire au-delà de `twitter:card` : les autres plateformes lisent
       Open Graph, qui suffit. -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Infonovice Maps">
  <meta property="og:locale" content="fr_FR">
  <meta property="og:url" content="https://maps.infonovice.fr/">
  <meta property="og:title" content="Infonovice Maps — cartographie souveraine française">
  <meta property="og:description" content="L’alternative française à Google Maps : fond IGN, adresses BAN, itinéraires, prix des carburants. Aucun traceur, aucun cookie, aucun compte.">
  <meta property="og:image" content="https://maps.infonovice.fr/partage-social.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Épingle de carte blanche à cœur ambre sur fond bleu profond, identité d’Infonovice Maps">
  <meta name="twitter:card" content="summary_large_image">
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebApplication",
    "name": "Infonovice Maps",
    "url": "https://maps.infonovice.fr/",
    "applicationCategory": "TravelApplication",
    "operatingSystem": "Tout navigateur web moderne",
    "inLanguage": "fr-FR",
    "isAccessibleForFree": true,
    "offers": { "@type": "Offer", "price": "0", "priceCurrency": "EUR" },
    "description": "Cartographie et itinéraires souverains fondés sur les données publiques françaises : fond IGN, adresses BAN, prix des carburants, bornes de recharge. Sans traceur, sans cookie, sans compte.",
    "license": "https://www.gnu.org/licenses/agpl-3.0.html",
    "publisher": { "@type": "Organization", "name": "Infonovice", "url": "https://infonovice.fr/" },
    "featureList": [
      "Recherche d’adresse (Base Adresse Nationale)",
      "Itinéraires voiture et piéton avec étapes et évitements",
      "Profil altimétrique et feuille de route imprimable",
      "Export GPX et KML, partage par lien sans serveur",
      "Prix des carburants, bornes de recharge, parkings",
      "Favoris et export de vos données en JSON"
    ]
  }
  </script>
  <script type="module" src="/src/main.ts"></script>
</head>
<body>
  <a class="evitement" href="#carte">Aller à la carte</a>
  <header class="entete" role="banner">
    <!-- LA MARQUE MÈNE À MAPS PRO (PRO-LIENS-1, 05/09). Armelin : « pouvoir
         cliquer sur le logo Infonovice Maps en haut à gauche pour aller sur
         la landing page ». Un lien, pas un script : il marche avant le
         bundle et sans lui. -->
    <a class="entete-marque" href="/pro.html" title="Infonovice Maps et Maps Pro">Infonovice <strong>Maps</strong></a>
    <span class="entete-note">Cartographie souveraine — IGN&nbsp;· BAN&nbsp;· zéro tracking</span>
    <!-- LA BARRE DE RECHERCHE EXISTE AVANT LE SCRIPT (PERF-1, 04/09). Mesuré
         par Lighthouse mobile en production : le plus grand élément peint
         (LCP) est le texte « Rechercher une adresse… », et il n'arrivait
         qu'à 5,0 s — 4,3 s de « render delay » — parce que la barre naissait
         en JavaScript, après le téléchargement et l'exécution de tout le
         bundle. Cette coquille a la géométrie exacte de la vraie barre ; le
         composant la retire en se posant. Inerte : ni saisie, ni tabulation,
         ni lecteur d'écran. -->
    <div class="recherche-attente" aria-hidden="true">
      <input type="search" placeholder="Rechercher une adresse…" disabled tabindex="-1">
    </div>
  </header>
  <!-- LE REPÈRE PRINCIPAL ET L'APPLICATION SONT DEUX NŒUDS, et il le faut.
       `role="application"` est le bon choix pour une carte : il demande au
       lecteur d'écran de laisser passer les touches, sans quoi les flèches
       déplaceraient le curseur de lecture au lieu de la carte. Mais posé sur
       <main>, il ÉCRASAIT le point de repère principal de la page — relevé par
       l'audit « arbre d'accessibilité » de Lighthouse le 26/08/2026. Le rôle
       descend donc sur un conteneur interne, qui EMPORTE l'id : les trente
       parcours E2E et la feuille de style désignent `#carte`, et `#carte`
       reste le nœud que MapLibre reçoit. -->
  <main>
    <div id="carte" role="application" aria-label="Carte de France interactive.
      Utilisez les boutons Zoomer, Dézoomer et Me localiser en haut à droite."></div>
  </main>
  <nav class="pied-carte" aria-label="Informations sur le service">
    <a href="/a-propos.html">À propos</a>
    <a href="/offre-flottes.html">Professionnels</a>
    <a href="/vie-privee.html">Vie privée</a>
    <a href="/mentions-legales.html">Mentions légales</a>
  </nav>
  <noscript>
    <p class="sans-js">Infonovice Maps a besoin de JavaScript pour afficher la
    carte. Aucune donnée personnelle n’est collectée : les requêtes vont aux
    services publics français (IGN, BAN…) et, pour les seules prévisions
    météo, au service européen Open-Meteo.</p>
  </noscript>
</body>
</html>
